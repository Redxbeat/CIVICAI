services:
  database:
    image: postgis/postgis:16-3.4
    container_name: civicai-db
    environment:
      POSTGRES_DB: civicai
      POSTGRES_USER: civicai
      POSTGRES_PASSWORD: civicai123
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civicai -d civicai"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: civicai-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: civicai-backend
    environment:
      DATABASE_URL: postgresql+psycopg2://civicai:civicai123@database:5432/civicai
      REDIS_URL: redis://redis:6379/0
      APP_ENV: development
      JWT_SECRET_KEY: supersecretjwtkey
      CORS_ORIGINS: '["http://localhost:3000"]'
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 15s
      timeout: 10s
      retries: 10

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8001
    container_name: civicai-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8001
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 15s
      timeout: 10s
      retries: 10

volumes:
  postgres_data:
